name: scenegems

# The single-machine workbench: web console, a plain local MQTT broker and the backend, which
# starts the subsystem containers on this machine. ./start.sh runs it; nothing here is
# deployed to other machines (the cluster's stacks are deploy/master and deploy/node).

services:
  frontend:
    image: scenegems-frontend:dev
    container_name: scenegems_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://127.0.0.1:5174/ws/scenegems_backend_service

  # Plain MQTT without accounts, so it is published on 127.0.0.1 only and other hosts cannot
  # reach it. Containers reach it as broker:1883 on the compose network.
  broker:
    image: scenegems-mqtt-broker:latest
    container_name: scenegems_local_mqtt_broker
    labels:
      - group=Services
    restart: unless-stopped
    ports:
      - "127.0.0.1:1882:1883"
      - "127.0.0.1:8082:8083"
    volumes:
      - scenegems_broker_data:/data/broker/

  backend:
    image: scenegems-backend:latest
    container_name: scenegems_backend
    ports:
      - "5174:5174"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scenegems_runtime_assets:/app/assets/runtime_assets
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER_HOST: broker
      MQTT_BROKER_PORT: "1883"
      SCENEGEMS_RUNTIME_VOLUME: scenegems_runtime_assets
      SCENEGEMS_DOCKER_NETWORK: scenegems_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scenegems_runtime_assets:
    name: scenegems_runtime_assets
  scenegems_broker_data:
    name: scenegems_broker_data
