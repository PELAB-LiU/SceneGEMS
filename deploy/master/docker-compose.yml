name: scenegems-${SCENEGEMS_MASTER_ID:?set SCENEGEMS_MASTER_ID in .env}

# One master of a SceneGEMS cluster: Postgres, the cluster broker and master-api. The
# deployment tool installs this file with release.json and .env into one folder per master
# (scenegems_tool.cluster.release.roles) and runs, in that folder:
#   docker compose --profile tools run --rm -T security init     (once, and after address changes)
#   docker compose up -d
# The master id scopes the project, container and volume names, and the ports come from .env,
# so several masters can run on one machine.

services:
  # Job store and node registry (scenegems_tool.persistence). Without POSTGRES_PASSWORD the
  # container refuses to start.
  postgres:
    image: postgres:16.10-alpine
    container_name: scenegems-${SCENEGEMS_MASTER_ID}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenegems}
      POSTGRES_USER: ${POSTGRES_USER:-scenegems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cluster broker (scenegems_tool.cluster.security): MQTT over TLS for every node, logins
  # checked by master-api, per-node access rules. `security init` writes its configuration.
  cluster-broker:
    image: scenegems-mqtt-broker:latest
    container_name: scenegems-${SCENEGEMS_MASTER_ID}-cluster-broker
    restart: unless-stopped
    command: ["nanomq", "start", "--conf", "/etc/scenegems/broker/nanomq.conf"]
    ports:
      - "${SCENEGEMS_BROKER_BIND_ADDRESS:-0.0.0.0}:${SCENEGEMS_BROKER_TLS_PORT:-8883}:8883"
    volumes:
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/broker:/etc/scenegems/broker:ro

  # The master (scenegems_tool.cluster.master): node API over HTTPS, the operator API with the
  # workbench gateway on this machine only, and the broker login hook on this compose network
  # only (cluster-broker calls http://master-api:8090). It migrates the database before it
  # starts and reads the image fingerprints its nodes must have from release.json. It mounts
  # the security folder without the CA key, and the Docker socket for the workbench gateway.
  master-api:
    image: ${SCENEGEMS_MASTER_IMAGE:-scenegems-backend:latest}
    container_name: scenegems-${SCENEGEMS_MASTER_ID}-master-api
    restart: unless-stopped
    command: ["sh", "-c", "python -m scenegems_tool.persistence.migrate upgrade head && exec python -m scenegems_tool.cluster.master"]
    depends_on:
      postgres:
        condition: service_healthy
      cluster-broker:
        condition: service_started
    ports:
      - "${SCENEGEMS_API_BIND_ADDRESS:-0.0.0.0}:${SCENEGEMS_API_PORT:-8443}:8443"
      - "127.0.0.1:${SCENEGEMS_OPERATOR_PORT:-5174}:5174"
    environment:
      PYTHONPATH: /app/src
      SCENEGEMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scenegems}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-scenegems}
      SCENEGEMS_SECURITY_DIR: /etc/scenegems/security
      SCENEGEMS_BROKER_AUTH_HOOK_SECRET: ${SCENEGEMS_BROKER_AUTH_HOOK_SECRET:-}
      SCENEGEMS_RELEASE_MANIFEST: /etc/scenegems/release.json
      SCENEGEMS_API_LISTEN_HOST: 0.0.0.0
      SCENEGEMS_API_LISTEN_PORT: "8443"
      SCENEGEMS_OPERATOR_LISTEN_HOST: 0.0.0.0
      SCENEGEMS_OPERATOR_LISTEN_PORT: "5174"
      SCENEGEMS_BROKER_HOOK_LISTEN_HOST: 0.0.0.0
      SCENEGEMS_BROKER_HOOK_LISTEN_PORT: "8090"
      SCENEGEMS_RUNTIME_VOLUME: scenegems-${SCENEGEMS_MASTER_ID}-runtime
      SCENEGEMS_DOCKER_NETWORK: scenegems-${SCENEGEMS_MASTER_ID}_default
    volumes:
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/master.json:/etc/scenegems/security/master.json:ro
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/ca/ca_certificate.pem:/etc/scenegems/security/ca/ca_certificate.pem:ro
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/api:/etc/scenegems/security/api:ro
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/store:/etc/scenegems/security/store
      - ./release.json:/etc/scenegems/release.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime:/app/assets/runtime_assets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5174/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-off security tool (scenegems_tool.cluster.security), not started by `up`:
  #   docker compose --profile tools run --rm -T security init
  #   docker compose --profile tools run --rm -T security pairing-token create --note <node>
  # init creates or updates the CA, the API and broker certificates and the broker files;
  # pairing-token create prints a node's pairing values as .env lines.
  security:
    image: ${SCENEGEMS_MASTER_IMAGE:-scenegems-backend:latest}
    profiles: ["tools"]
    entrypoint: ["python", "-m", "scenegems_tool.cluster.security", "--security-dir", "/etc/scenegems/security"]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}:/etc/scenegems/security
    network_mode: none

volumes:
  postgres_data:
  runtime:
    name: scenegems-${SCENEGEMS_MASTER_ID}-runtime
