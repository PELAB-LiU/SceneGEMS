name: scenegems

services:
  frontend:
    image: scenegems-frontend:dev
    container_name: scenegems_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://127.0.0.1:5174/ws/scenegems_backend_service

  # Workbench broker: plain MQTT without accounts, so it is published on 127.0.0.1 only and
  # other hosts cannot reach it. Containers reach it as broker:1883 on the compose network.
  broker:
    image: scenegems-mqtt-broker:latest
    container_name: scenegems_local_mqtt_broker
    labels:
      - group=Services
    restart: unless-stopped
    ports:
      - "127.0.0.1:1882:1883"
      - "127.0.0.1:8082:8083"
    volumes:
      - scenegems_broker_data:/data/broker/

  # Cluster broker of this master (scenegems_tool.cluster.security): MQTT over TLS for every
  # node, logins checked by the master, per-node access rules. Create its configuration
  # first with `python -m scenegems_tool.cluster.security --env-file deploy/master/.env init`,
  # then start it with `docker compose --profile cluster up -d cluster-broker`.
  cluster-broker:
    image: scenegems-mqtt-broker:latest
    container_name: scenegems-${SCENEGEMS_MASTER_ID:-master}-cluster-broker
    profiles: ["cluster"]
    restart: unless-stopped
    command: ["nanomq", "start", "--conf", "/etc/scenegems/broker/nanomq.conf"]
    ports:
      - "${SCENEGEMS_BROKER_BIND_ADDRESS:-0.0.0.0}:${SCENEGEMS_BROKER_TLS_PORT:-8883}:8883"
    volumes:
      - ${SCENEGEMS_SECURITY_DIR:-./security_data}/broker:/etc/scenegems/broker:ro

  backend:
    image: scenegems-backend:latest
    container_name: scenegems_backend
    ports:
      - "5174:5174"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scenegems_runtime_assets:/app/assets/runtime_assets
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER_HOST: broker
      MQTT_BROKER_PORT: "1883"
      SCENEGEMS_RUNTIME_VOLUME: scenegems_runtime_assets
      SCENEGEMS_DOCKER_NETWORK: scenegems_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Job store and node registry of the master (scenegems_tool.persistence). The password
  # comes from deploy/master/.env; without it the container refuses to start, while the
  # workbench services above keep working.
  postgres:
    image: postgres:16.10-alpine
    container_name: scenegems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenegems}
      POSTGRES_USER: ${POSTGRES_USER:-scenegems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - scenegems_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  scenegems_runtime_assets:
    name: scenegems_runtime_assets
  scenegems_broker_data:
    name: scenegems_broker_data
  scenegems_postgres_data:
    name: scenegems_postgres_data
