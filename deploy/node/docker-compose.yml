# One node instance of one master: the node daemon (scenegems_tool.cluster.node.daemon) in its
# container. It holds the Docker socket and starts every job in a subsystem container next to it.
#
#   docker compose -f deploy/node/docker-compose.yml --env-file deploy/node/.env up -d
#
# The values come from the env file (template: deploy/node/.env.example). The project, the
# container, the network and the volumes are all named scenegems-node-<master id>-<node name>,
# so one machine can run nodes for several masters, and several nodes of one master, side by
# side: one env file each. Pairing state lives in the state volume; remove it to pair again.
name: scenegems-node-${SCENEGEMS_MASTER_ID:?set SCENEGEMS_MASTER_ID in the env file}-${SCENEGEMS_NODE_NAME:?set SCENEGEMS_NODE_NAME in the env file}

services:
  node:
    image: scenegems-node:${SCENEGEMS_NODE_IMAGE_TAG:-latest}
    container_name: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}
    restart: unless-stopped
    # Time for running jobs to stop, remove their containers and give their leases back.
    stop_grace_period: 60s
    environment:
      SCENEGEMS_MASTER_URL: ${SCENEGEMS_MASTER_URL:?set SCENEGEMS_MASTER_URL in the env file}
      SCENEGEMS_MASTER_ID: ${SCENEGEMS_MASTER_ID}
      SCENEGEMS_MASTER_CA_SHA256: ${SCENEGEMS_MASTER_CA_SHA256:?set SCENEGEMS_MASTER_CA_SHA256 in the env file}
      SCENEGEMS_PAIRING_TOKEN: ${SCENEGEMS_PAIRING_TOKEN:-}
      SCENEGEMS_NODE_NAME: ${SCENEGEMS_NODE_NAME}
      SCENEGEMS_NODE_CAPABILITIES: ${SCENEGEMS_NODE_CAPABILITIES:?set SCENEGEMS_NODE_CAPABILITIES in the env file}
      SCENEGEMS_NODE_LABELS: ${SCENEGEMS_NODE_LABELS:-}
      SCENEGEMS_NODE_REFERENCE_GEOFENCE: ${SCENEGEMS_NODE_REFERENCE_GEOFENCE:-}
      SCENEGEMS_SOFTWARE_REVISION: ${SCENEGEMS_SOFTWARE_REVISION:-}
      # Paths inside this container and the Docker names job containers use; not for the env file.
      SCENEGEMS_NODE_STATE_DIR: /var/lib/scenegems-node
      SCENEGEMS_NODE_TRUST_DIR: /etc/scenegems/trust
      SCENEGEMS_NODE_TRUST_SOURCE: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}-trust
      SCENEGEMS_DOCKER_NETWORK: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}
      SCENEGEMS_RUNTIME_VOLUME: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}-runtime
      SCENEGEMS_REPOSITORY_DIR: /repository
      # Subsystem images; empty means the locally built default (scenegems_tool/cluster/node/subsystem.py).
      SCENARIO_GENERATION_IMAGE: ${SCENARIO_GENERATION_IMAGE:-}
      TRAJECTORY_GENERATION_IMAGE: ${TRAJECTORY_GENERATION_IMAGE:-}
      MONITORING_IMAGE: ${MONITORING_IMAGE:-}
      SCENARIO_EXECUTION_IMAGE: ${SCENARIO_EXECUTION_IMAGE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SCENEGEMS_CHECKOUT_DIR:-../..}:/repository:ro
      # Generated compose files and stack files of the node's instances; SITL and Gazebo mount it too.
      - runtime:/app/assets/runtime_assets
      - state:/var/lib/scenegems-node
      # The master's CA certificate alone; job containers mount this volume read-only.
      - trust:/etc/scenegems/trust
    networks:
      - node
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Pooled services join this network to reach the master's broker; it is removed with the node.
networks:
  node:
    name: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}

volumes:
  runtime:
    name: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}-runtime
  state:
    name: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}-state
  trust:
    name: scenegems-node-${SCENEGEMS_MASTER_ID}-${SCENEGEMS_NODE_NAME}-trust
